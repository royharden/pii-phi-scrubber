[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "m7-synthetic-log-redaction"
version = "0.1.0"
description = "A bounded synthetic-log redaction experiment scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/m7"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
